name: Build and Push (Tester)

on:
  workflow_call:
    secrets:
      GIT_CREDENTIALS:
        required: true
    inputs:
      ORG_NAME:
        description: "GitHub organization name"
        required: true
        type: string
      REPO_NAME:
        description: "Repository name (image pushed as <REPO_NAME>-<IMAGE_SUFFIX>)"
        required: true
        type: string
      CARGO_FEATURES:
        description: "Cargo features to enable for the tester build"
        required: false
        type: string
        default: "tester"
      IMAGE_SUFFIX:
        description: "Image name suffix: pushed as <REPO_NAME>-<IMAGE_SUFFIX> (e.g. tester, public)"
        required: false
        type: string
        default: "tester"

jobs:
  build-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: |
          echo "COMMIT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      # Buildx runs against its Git context (no `context:` input below),
      # which carries no `.git` — so a build that stamps its own revision
      # into the binary is handed that revision here rather than reading
      # it. The first 7 characters are the image tag below, so a running
      # binary's reported commit names the image it shipped in. A build
      # that declares no matching ARG ignores it.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            GIT_CREDENTIALS=${{ secrets.GIT_CREDENTIALS }}
            GIT_SHA=${{ github.sha }}
            CARGO_FEATURES=${{ inputs.CARGO_FEATURES }}
          push: true
          tags: |
            ghcr.io/${{ inputs.ORG_NAME }}/${{ inputs.REPO_NAME }}-${{ inputs.IMAGE_SUFFIX }}:latest
            ghcr.io/${{ inputs.ORG_NAME }}/${{ inputs.REPO_NAME }}-${{ inputs.IMAGE_SUFFIX }}:${{ env.COMMIT_SHA }}
