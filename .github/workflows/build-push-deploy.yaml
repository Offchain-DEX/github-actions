name: Build, Push and Deploy

on:
  workflow_call:
    secrets:
      GIT_CREDENTIALS:
        required: true
      # Optional separate credential for the GitOps deploy push. Lets a
      # cross-org deploy (e.g. prod → mnhhub/infra) use a token scoped only
      # to the gitops repo, while GIT_CREDENTIALS stays scoped to reading the
      # build's own-org private deps. Defaults to GIT_CREDENTIALS when unset,
      # so same-org callers (staging/master/tester) are unaffected.
      GITOPS_CREDENTIALS:
        required: false
    inputs:
      ORG_NAME:
        description: "GitHub organization name"
        required: true
        type: string
      REPO_NAME:
        description: "Repository name for Docker image"
        required: true
        type: string
      ENV_NAME:
        description: "Environment name for deployment (old hub)"
        required: false
        type: string
        default: ""
      SKIP_DEPLOY:
        description: "Skips deployment, only builds and pushes image"
        required: false
        type: boolean
        default: false
      GITOPS_REPO:
        description: "GitOps repo to update (e.g. Offchain-DEX/testnet-gitops-vultr)"
        required: false
        type: string
        default: "Offchain-DEX/testnet-gitops-vultr"
      GITOPS_DIR:
        description: "Directory name in gitops repo (defaults to REPO_NAME)"
        required: false
        type: string
        default: ""
      GITOPS_BASE:
        description: "Base path in gitops repo (defaults to kubernetes/hub)"
        required: false
        type: string
        default: "kubernetes/hub"

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: |
          echo "COMMIT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            GIT_CREDENTIALS=${{ secrets.GIT_CREDENTIALS }}
          push: true
          tags: |
            ghcr.io/${{ inputs.ORG_NAME }}/${{ inputs.REPO_NAME }}:${{ github.ref_name }}
            ghcr.io/${{ inputs.ORG_NAME }}/${{ inputs.REPO_NAME }}:${{ env.COMMIT_SHA }}

      - name: Configure git
        if: inputs.SKIP_DEPLOY == false
        run: |
          git config --global user.name "GitHub Actions Deploy"
          git config --global user.email "actions@github.com"

      - name: Deploy to GitOps repo
        if: inputs.SKIP_DEPLOY == false
        run: |
          # GITOPS_DIR is a whitespace-separated list, so one image that backs
          # several deployments (e.g. a workspace shipping multiple binaries)
          # bumps every one of them in the same commit. A single value is the
          # common case and loops exactly once.
          GITOPS_DIR="${{ inputs.GITOPS_DIR }}"
          if [ -z "$GITOPS_DIR" ]; then
            GITOPS_DIR="${{ inputs.REPO_NAME }}"
          fi

          rm -rf /tmp/gitops
          # Use the dedicated gitops credential when provided (cross-org deploys
          # like prod → mnhhub/infra), else fall back to GIT_CREDENTIALS for
          # same-org callers. The `git push` below reuses this URL's embedded
          # token via the origin remote.
          git clone https://x-access-token:${{ secrets.GITOPS_CREDENTIALS || secrets.GIT_CREDENTIALS }}@github.com/${{ inputs.GITOPS_REPO }}.git /tmp/gitops
          cd /tmp/gitops

          for dir in $GITOPS_DIR; do
            DEPLOY_FILE="${{ inputs.GITOPS_BASE }}/${dir}/templates/deployment.yaml"
            if [ ! -f "$DEPLOY_FILE" ]; then
              echo "ERROR: $DEPLOY_FILE not found in gitops repo"
              exit 1
            fi

            sed -i "/##-image-replacer-##$/c\          image: ghcr.io/${{ inputs.ORG_NAME }}/${{ inputs.REPO_NAME }}:${{ env.COMMIT_SHA }} ##-image-replacer-##" "$DEPLOY_FILE"

            git add "$DEPLOY_FILE"
          done

          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Deploy ${{ inputs.REPO_NAME }}:${{ env.COMMIT_SHA }}"
          git push

          rm -rf /tmp/gitops
